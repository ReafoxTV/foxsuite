<div id="view-users" class="view" hidden>
  <a href="/profile" data-view="profile" class="portal-back-profile">← Volver a mi perfil</a>
  <div class="page-heading">

      Administración
    </h1>
  </div>
  <div class="users-grid">
    <div class="user-admin-sidebar">
      <section class="user-create">
        <h2>Crear usuario</h2>
        <form id="userForm">
          <label>Nombre de usuario<input id="newUser" autocomplete="off" maxlength="64" required></label>
          <label>Contraseña · mínimo 12 caracteres<input id="newPassword" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
          <button class="create-user-button">
            <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 15.5H7.5C6.10444 15.5 5.40665 15.5 4.83886 15.6722C3.56045 16.06 2.56004 17.0605 2.17224 18.3389C2 18.9067 2 19.6044 2 21M19 21V15M16 18H22M14.5 7.5C14.5 9.98528 12.4853 12 10 12C7.51472 12 5.5 9.98528 5.5 7.5C5.5 5.01472 7.51472 3 10 3C12.4853 3 14.5 5.01472 14.5 7.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Crear usuario
          </button>
        </form>
      </section>
      <section id="moduleStatusPanel" class="user-module-settings" hidden>
        <h2>Estado de las aplicaciones</h2>
        <p>Elige una aplicación para consultar o cambiar su disponibilidad.</p>
        <form id="moduleStatusForm" class="admin-module-settings">
          <label for="moduleStatusApp">Aplicación
            <select id="moduleStatusApp" name="module" required></select>
          </label>
          <p id="moduleCurrentStatus" class="module-current-status" aria-live="polite"></p>
          <label for="moduleStatusValue">Nuevo estado
            <select id="moduleStatusValue" name="status" required>
              <option value="available">Disponible</option>
              <option value="partial">Parcialmente disponible</option>
              <option value="unavailable">No disponible</option>
            </select>
          </label>
          <button type="submit">
            <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 3V6.4C7 6.96005 7 7.24008 7.10899 7.45399C7.20487 7.64215 7.35785 7.79513 7.54601 7.89101C7.75992 8 8.03995 8 8.6 8H15.4C15.9601 8 16.2401 8 16.454 7.89101C16.6422 7.79513 16.7951 7.64215 16.891 7.45399C17 7.24008 17 6.96005 17 6.4V4M17 21V14.6C17 14.0399 17 13.7599 16.891 13.546C16.7951 13.3578 16.6422 13.2049 16.454 13.109C16.2401 13 15.9601 13 15.4 13H8.6C8.03995 13 7.75992 13 7.54601 13.109C7.35785 13.2049 7.20487 13.3578 7.10899 13.546C7 13.7599 7 14.0399 7 14.6V21M21 9.32548V16.2C21 17.8802 21 18.7202 20.673 19.362C20.3854 19.9265 19.9265 20.3854 19.362 20.673C18.7202 21 17.8802 21 16.2 21H7.8C6.11984 21 5.27976 21 4.63803 20.673C4.07354 20.3854 3.6146 19.9265 3.32698 19.362C3 18.7202 3 17.8802 3 16.2V7.8C3 6.11984 3 5.27976 3.32698 4.63803C3.6146 4.07354 4.07354 3.6146 4.63803 3.32698C5.27976 3 6.11984 3 7.8 3H14.6745C15.1637 3 15.4083 3 15.6385 3.05526C15.8425 3.10425 16.0376 3.18506 16.2166 3.29472C16.4184 3.4184 16.5914 3.59135 16.9373 3.93726L20.0627 7.06274C20.4086 7.40865 20.5816 7.5816 20.7053 7.78343C20.8149 7.96237 20.8957 8.15746 20.9447 8.36154C21 8.59171 21 8.8363 21 9.32548Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Guardar estado
          </button>
        </form>
      </section>
    </div>
    <section class="user-list">
      <div class="row">
        <h2>Usuarios creados</h2>
        <button id="refreshUsers" class="secondary small">Actualizar</button>
      </div>
      <div id="users"></div>
    </section>
  </div>
  <section class="admin-feedback-inbox">
    <div class="row">
      <div>
        <h2>Sugerencias e informes de errores</h2>
      </div>
      <div class="admin-feedback-controls">
        <label for="adminFeedbackFilter">Ver
          <select id="adminFeedbackFilter">
            <option value="new">Nuevos</option>
            <option value="reviewed">Revisados</option>
          </select>
        </label>
        <button id="refreshFeedback" class="secondary small" type="button">Actualizar</button>
      </div>
    </div>
    <div id="adminFeedbackList" aria-live="polite"></div>
  </section>
</div>
